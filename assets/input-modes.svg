<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Three input modes: A you give inputs and they are used as the source of truth, B you give little and it pulls from your Claude Project, attached files and the website, C a critical field is missing and it asks once">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1c"/><stop offset="1" stop-color="#101a3a"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    .f { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -12; } }
    .glow { animation: glow 3s ease-in-out infinite; }
    @keyframes glow { 0%,100% { stroke-opacity: .45; } 50% { stroke-opacity: 1; } }
  </style>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>

  <g class="f">
    <text x="40" y="44" font-size="12" font-weight="700" fill="#64748b" letter-spacing=".8">STEP 0 · WHERE THE INPUTS COME FROM</text>

    <!-- Mode A -->
    <g transform="translate(40,66)">
      <rect width="300" height="64" rx="14" fill="#0b1324" stroke="#22d3ee" stroke-opacity=".6"/>
      <text x="18" y="27" font-size="14" font-weight="800" fill="#a5f3fc">A · You give inputs</text>
      <text x="18" y="47" font-size="12" fill="#cbd5e1">Template or one line in the chat</text>
    </g>
    <!-- Mode B -->
    <g transform="translate(40,142)">
      <rect width="300" height="64" rx="14" fill="#0b1324" stroke="#a78bfa" stroke-opacity=".6"/>
      <text x="18" y="27" font-size="14" font-weight="800" fill="#ddd6fe">B · You give little</text>
      <text x="18" y="47" font-size="12" fill="#cbd5e1">Just a keyword, inside a Project</text>
    </g>
    <!-- Mode C -->
    <g transform="translate(40,218)">
      <rect width="300" height="64" rx="14" fill="#0b1324" stroke="#fbbf24" stroke-opacity=".6"/>
      <text x="18" y="27" font-size="14" font-weight="800" fill="#fde68a">C · Something critical missing</text>
      <text x="18" y="47" font-size="12" fill="#cbd5e1">No site, keyword or market found</text>
    </g>

    <!-- Sources column -->
    <g transform="translate(420,60)">
      <rect width="380" height="186" rx="16" fill="#0b1324" stroke="#334155"/>
      <text x="20" y="28" font-size="12" font-weight="700" fill="#64748b" letter-spacing=".6">LOOKS IN THIS ORDER</text>
      <g font-size="13" fill="#e2e8f0">
        <circle cx="30" cy="50" r="4" fill="#22d3ee"/><text x="44" y="55">Your message</text>
        <circle cx="30" cy="74" r="4" fill="#22d3ee"/><text x="44" y="79">Attached files</text>
        <circle cx="30" cy="98" r="4" fill="#a78bfa"/><text x="44" y="103">Claude Project · instructions, knowledge, memory</text>
        <circle cx="30" cy="122" r="4" fill="#a78bfa"/><text x="44" y="127">Your general memory</text>
        <circle cx="30" cy="146" r="4" fill="#34d399"/><text x="44" y="151">Live website · services, tone, real URLs</text>
        <circle cx="30" cy="170" r="4" fill="#34d399"/><text x="44" y="175">SERP research · intent, competitors</text>
      </g>
    </g>

    <!-- Output -->
    <g transform="translate(880,66)">
      <rect class="glow" width="280" height="140" rx="16" fill="#0b1324" stroke="#34d399" stroke-width="2"/>
      <text x="20" y="32" font-size="15" font-weight="800" fill="#a7f3d0">Resolved Inputs table</text>
      <g class="mono" font-size="11">
        <text x="20" y="60" fill="#94a3b8">Field</text><text x="120" y="60" fill="#94a3b8">Value</text><text x="200" y="60" fill="#94a3b8">Source</text>
        <text x="20" y="82" fill="#e2e8f0">Tone</text><text x="120" y="82" fill="#e2e8f0">Expert</text><text x="200" y="82" fill="#c4b5fd">Project</text>
        <text x="20" y="102" fill="#e2e8f0">Area</text><text x="120" y="102" fill="#e2e8f0">Brisbane</text><text x="200" y="102" fill="#6ee7b7">Website</text>
        <text x="20" y="122" fill="#e2e8f0">USPs</text><text x="120" y="122" fill="#e2e8f0">—</text><text x="200" y="122" fill="#fcd34d">Not given</text>
      </g>
    </g>
    <g transform="translate(880,218)">
      <rect width="280" height="64" rx="14" fill="#0b1324" stroke="#fbbf24" stroke-opacity=".6"/>
      <text x="18" y="27" font-size="13" font-weight="800" fill="#fde68a">Asks once, max 4 questions</text>
      <text x="18" y="47" font-size="12" fill="#cbd5e1">with likely answers to confirm</text>
    </g>

    <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)">
      <path class="flow" d="M342 98H416"/>
      <path class="flow" d="M342 174H416"/>
      <path class="flow" d="M802 136H876"/>
      <path class="flow" d="M342 264H876"/>
    </g>
  </g>
</svg>
