<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="SEO Research and Content System: a Claude skill that researches the SERP and top 3 competitors, then writes a publish-ready service page or blog article with a quality audit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1c"/>
      <stop offset="0.55" stop-color="#0d1730"/>
      <stop offset="1" stop-color="#101a3a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;600 0;0 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0" stop-color="#22d3ee" stop-opacity=".45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#a78bfa" stop-opacity=".40"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbC"><stop offset="0" stop-color="#34d399" stop-opacity=".30"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="400" rx="22"/></clipPath>
  </defs>

  <style>
    .f { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .fade1 { opacity: 0; animation: fade .9s ease-out .2s forwards; }
    .fade2 { opacity: 0; animation: fade .9s ease-out .6s forwards; }
    .fade3 { opacity: 0; animation: fade .9s ease-out 1.0s forwards; }
    .fade4 { opacity: 0; animation: fade .9s ease-out 1.4s forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .float { animation: float 6s ease-in-out infinite; }
    .float2 { animation: float 7s ease-in-out -2s infinite; }
    .float3 { animation: float 6.5s ease-in-out -4s infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    .w1 { clip-path: inset(0 100% 0 0); animation: w1 9s steps(30) infinite; }
    .w2 { clip-path: inset(0 100% 0 0); animation: w2 9s steps(30) infinite; }
    .w3 { clip-path: inset(0 100% 0 0); animation: w3 9s steps(30) infinite; }
    .w4 { clip-path: inset(0 100% 0 0); animation: w4 9s steps(30) infinite; }
    .w5 { clip-path: inset(0 100% 0 0); animation: w5 9s steps(30) infinite; }
    @keyframes w1 { 0%,4% { clip-path: inset(0 100% 0 0); } 14%,94% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
    @keyframes w2 { 0%,14% { clip-path: inset(0 100% 0 0); } 24%,94% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
    @keyframes w3 { 0%,24% { clip-path: inset(0 100% 0 0); } 34%,94% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
    @keyframes w4 { 0%,34% { clip-path: inset(0 100% 0 0); } 44%,94% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
    @keyframes w5 { 0%,44% { clip-path: inset(0 100% 0 0); } 54%,94% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow 9s ease-out infinite; }
    .g2 { animation-delay: .25s; } .g3 { animation-delay: .5s; } .g4 { animation-delay: .75s; }
    @keyframes grow { 0%,52% { transform: scaleX(0); } 70%,94% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    .pop { opacity: 0; animation: pop 9s ease-out infinite; }
    @keyframes pop { 0%,72% { opacity: 0; } 78%,94% { opacity: 1; } 100% { opacity: 0; } }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>

    <circle r="220" fill="url(#orbA)">
      <animate attributeName="cx" values="120;260;120" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;140;60" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="260" fill="url(#orbB)">
      <animate attributeName="cx" values="1050;900;1050" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="360;260;360" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle r="180" fill="url(#orbC)">
      <animate attributeName="cx" values="640;720;640" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="420;330;420" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- Left: text -->
    <g class="f">
      <g class="fade1">
        <rect x="70" y="62" width="316" height="30" rx="15" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/>
        <circle cx="90" cy="77" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
        <text x="104" y="82" font-size="14" font-weight="600" fill="#a5f3fc" letter-spacing=".5">CLAUDE SKILL · SEO · AEO · GEO</text>
      </g>
      <text class="fade2" x="68" y="158" font-size="58" font-weight="800" fill="url(#title)" letter-spacing="-1">SEO Research</text>
      <text class="fade3" x="70" y="212" font-size="42" font-weight="700" fill="#f8fafc">&amp; Content System</text>
      <text class="fade4" x="70" y="256" font-size="19" fill="#94a3b8">Keyword  →  SERP  →  top 3 competitors  →  publish-ready page</text>

      <g class="fade4 mono" font-size="13" font-weight="600">
        <rect x="70" y="292" width="170" height="36" rx="10" fill="#0f172a" stroke="#334155"/>
        <text x="86" y="315" fill="#22d3ee">PAA · AI</text><text x="160" y="315" fill="#cbd5e1">→ queries</text>
        <rect x="250" y="292" width="176" height="36" rx="10" fill="#0f172a" stroke="#334155"/>
        <text x="266" y="315" fill="#a78bfa">Top 3</text><text x="318" y="315" fill="#cbd5e1">→ content gap</text>
        <rect x="436" y="292" width="160" height="36" rx="10" fill="#0f172a" stroke="#334155"/>
        <text x="452" y="315" fill="#34d399">Audit</text><text x="500" y="315" fill="#cbd5e1">→ 8+/10</text>
      </g>
    </g>

    <!-- Right: SERP card -->
    <g class="float2">
      <g transform="translate(640,40)">
        <rect width="230" height="150" rx="14" fill="#0b1324" stroke="#334155"/>
        <text x="16" y="26" class="f" font-size="10" font-weight="700" fill="#64748b" letter-spacing=".6">SERP · TOP 3</text>
        <g class="f" font-size="11.5">
          <circle cx="24" cy="50" r="9" fill="#22d3ee" fill-opacity=".15" stroke="#22d3ee"/><text x="24" y="54" text-anchor="middle" font-size="10" font-weight="800" fill="#a5f3fc">1</text>
          <rect x="42" y="42" width="150" height="7" rx="3.5" fill="#334155"/><rect x="42" y="54" width="110" height="5" rx="2.5" fill="#1e293b"/>
          <circle cx="24" cy="82" r="9" fill="#a78bfa" fill-opacity=".15" stroke="#a78bfa"/><text x="24" y="86" text-anchor="middle" font-size="10" font-weight="800" fill="#ddd6fe">2</text>
          <rect x="42" y="74" width="134" height="7" rx="3.5" fill="#334155"/><rect x="42" y="86" width="96" height="5" rx="2.5" fill="#1e293b"/>
          <circle cx="24" cy="114" r="9" fill="#34d399" fill-opacity=".15" stroke="#34d399"/><text x="24" y="118" text-anchor="middle" font-size="10" font-weight="800" fill="#a7f3d0">3</text>
          <rect x="42" y="106" width="160" height="7" rx="3.5" fill="#334155"/><rect x="42" y="118" width="118" height="5" rx="2.5" fill="#1e293b"/>
        </g>
        <rect x="16" y="131" width="104" height="12" rx="6" fill="#fbbf24" fill-opacity=".14"/>
        <text x="24" y="140" class="mono" font-size="8.5" fill="#fcd34d">content gaps: 7</text>
      </g>
    </g>

    <!-- Audit card -->
    <g class="float3">
      <g transform="translate(640,206)">
        <rect width="230" height="150" rx="14" fill="#0b1324" stroke="#334155"/>
        <text x="16" y="26" class="f" font-size="10" font-weight="700" fill="#64748b" letter-spacing=".6">QUALITY AUDIT</text>
        <g class="f" font-size="10.5" fill="#cbd5e1">
          <text x="16" y="54">Intent</text><rect x="84" y="46" width="112" height="8" rx="4" fill="#1e293b"/><rect class="grow" x="84" y="46" width="106" height="8" rx="4" fill="url(#bar)"/>
          <text x="16" y="80">Coverage</text><rect x="84" y="72" width="112" height="8" rx="4" fill="#1e293b"/><rect class="grow g2" x="84" y="72" width="100" height="8" rx="4" fill="url(#bar)"/>
          <text x="16" y="106">Accuracy</text><rect x="84" y="98" width="112" height="8" rx="4" fill="#1e293b"/><rect class="grow g3" x="84" y="98" width="106" height="8" rx="4" fill="url(#bar)"/>
          <text x="16" y="132">AEO/GEO</text><rect x="84" y="124" width="112" height="8" rx="4" fill="#1e293b"/><rect class="grow g4" x="84" y="124" width="96" height="8" rx="4" fill="url(#bar)"/>
        </g>
        <g class="pop f" font-size="11" font-weight="800" fill="#34d399">
          <text x="206" y="55">9</text><text x="206" y="81">9</text><text x="206" y="107">9</text><text x="206" y="133">8</text>
        </g>
      </g>
    </g>

    <!-- Right: draft page card -->
    <g class="float">
      <g transform="translate(888,56)">
        <rect width="282" height="288" rx="16" fill="#0b1324" stroke="#334155"/>
        <rect width="282" height="34" rx="16" fill="#111c33"/>
        <rect y="18" width="282" height="16" fill="#111c33"/>
        <circle cx="20" cy="17" r="5.5" fill="#f87171"/><circle cx="38" cy="17" r="5.5" fill="#fbbf24"/><circle cx="56" cy="17" r="5.5" fill="#34d399"/>
        <rect x="74" y="8" width="194" height="18" rx="9" fill="#1e293b"/>
        <text x="84" y="21" class="mono" font-size="9.5" fill="#94a3b8">/services/epoxy-garage-floors</text>

        <g class="f">
          <g class="w1"><text x="16" y="66" font-size="9" font-weight="800" fill="#22d3ee">H1</text><text x="34" y="66" font-size="12.5" font-weight="700" fill="#f8fafc">Epoxy Garage Floors in Brisbane</text></g>
          <g class="w2"><rect x="16" y="80" width="250" height="5" rx="2.5" fill="#334155"/><rect x="16" y="90" width="214" height="5" rx="2.5" fill="#334155"/><rect x="16" y="100" width="232" height="5" rx="2.5" fill="#334155"/></g>
          <g class="w3"><text x="16" y="128" font-size="9" font-weight="800" fill="#a78bfa">H2</text><text x="34" y="128" font-size="11.5" font-weight="600" fill="#e2e8f0">How the process works</text></g>
          <g class="w4"><rect x="16" y="140" width="240" height="5" rx="2.5" fill="#334155"/><rect x="16" y="150" width="180" height="5" rx="2.5" fill="#334155"/></g>
          <g class="w5"><text x="16" y="178" font-size="9" font-weight="800" fill="#a78bfa">H2</text><text x="34" y="178" font-size="11.5" font-weight="600" fill="#e2e8f0">Cost factors &amp; FAQs</text><rect x="160" y="169" width="2" height="12" fill="#22d3ee" class="caret"/>
            <rect x="16" y="190" width="226" height="5" rx="2.5" fill="#334155"/><rect x="16" y="200" width="160" height="5" rx="2.5" fill="#334155"/></g>
        </g>

        <g class="pop mono" font-size="9" font-weight="600">
          <rect x="16" y="222" width="58" height="18" rx="9" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/><text x="26" y="234" fill="#a5f3fc">meta ✓</text>
          <rect x="80" y="222" width="68" height="18" rx="9" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".5"/><text x="90" y="234" fill="#ddd6fe">schema ✓</text>
          <rect x="154" y="222" width="60" height="18" rx="9" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="164" y="234" fill="#a7f3d0">links ✓</text>
          <rect x="220" y="222" width="50" height="18" rx="9" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".5"/><text x="228" y="234" fill="#fde68a">AEO ✓</text>
        </g>
        <text x="16" y="268" class="f" font-size="9.5" fill="#64748b">Inputs: you · Claude Project · website · SERP</text>
      </g>
    </g>
  </g>
</svg>
